name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # apidiff necesita los tags anteriores
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false # sin dependencias: no hay go.sum que cachear
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: |
          go vet ./...
          go vet -tags live ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: API compatibility
        env:
          APIDIFF: golang.org/x/exp/cmd/apidiff@v0.0.0-20261007192929-f45ad48fbe92
        run: |
          prev=$(git describe --tags --abbrev=0 --exclude="$(git tag --points-at HEAD | head -n1)" 2>/dev/null || git describe --tags --abbrev=0)
          echo "Comparando la API contra $prev"
          git worktree add -q "$RUNNER_TEMP/prev" "$prev"
          (cd "$RUNNER_TEMP/prev" && go run "$APIDIFF" -m -w "$RUNNER_TEMP/prev.api" github.com/loc1263/gohoo)
          go run "$APIDIFF" -m -w "$RUNNER_TEMP/new.api" github.com/loc1263/gohoo
          out=$(go run "$APIDIFF" -m -incompatible "$RUNNER_TEMP/prev.api" "$RUNNER_TEMP/new.api")
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ["1.22.x", stable] # la versión mínima de go.mod y la última
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false # sin dependencias: no hay go.sum que cachear
      - name: Test
        run: go test -race ./...
